name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, v4]

permissions:
  contents: read

jobs:
  toml-format:
    name: Check TOML formatting and sorting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Tombi
        uses: tombi-toml/setup-tombi@a440d8b4f102acf7963db4fd2a99ca02e17f88f6 # v1.5.0

      - name: Check TOML formatting and sorting
        run: tombi format --check --diff

  check-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo registry + build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Rustfmt check
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy lint
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Check documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --all-features --no-deps

      - name: Build release
        if: matrix.os == 'ubuntu-latest'
        run: cargo build --locked --release

      - name: Cargo check
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

  minimal-versions:
    name: Check minimal-versions
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: nightly

      - name: Install minimal-version tools
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375  # v2.87.12
        with:
          tool: cargo-hack,cargo-minimal-versions

      - name: Run minimal-versions check
        run: cargo minimal-versions check --direct
